<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="My personal website."
    />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" type="image/svg+xml" href="/assets/signature-white.svg" />
    <link
      rel="preload"
      href="/assets/PlayfairDisplay-Italic.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />
    <link rel="stylesheet" href="./src/style.css" />
    <title>Jakub Rutkowski</title>
  </head>
  <body>
    <main class="relative grid min-h-dvh w-full grid-rows-[minmax(330px,1fr)_auto_auto] items-stretch gap-[clamp(0.4rem,1.2vh,1rem)] overflow-x-hidden pb-[clamp(0.75rem,2vh,1.5rem)] max-[767px]:gap-3 max-[767px]:pb-4">
      <div id="canvas-container" class="relative h-full min-h-0 w-full overflow-visible" aria-label="Interactive 3D business card">
        <picture class="card-poster" aria-hidden="true">
          <source srcset="/assets/card-poster-mobile.webp" media="(max-width: 767px)" type="image/webp" />
          <img src="/assets/card-poster-desktop.webp" alt="" />
        </picture>
      </div>
      <blockquote class="quote-block">
        &ldquo;Look at that subtle off-white coloring. The tasteful thickness of it. Oh my God, it even has a watermark&hellip;&rdquo;
      </blockquote>
      <a
        class="mx-auto block w-fit"
        href="https://github.com/rutkk"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Visit Jakub Rutkowski on GitHub"
      >
        <img class="signature-mark mx-auto mt-1 block w-[clamp(44px,5vw,72px)] max-w-[24vw]" src="/assets/signature-white.svg" alt="Signature" />
      </a>
    </main>
    <script>
      const clientIpv4 = fetch('https://api.ipify.org?format=json')
        .then(response => (response.ok ? response.json() : null))
        .then(data => data?.ip)
        .catch(() => null)

      window.umamiBeforeSend = async (type, payload) => {
        const ip = await clientIpv4

        if (!ip) {
          return payload
        }

        return {
          ...payload,
          data: {
            ...(payload.data || {}),
            client_ipv4: ip,
          },
        }
      }
    </script>
    <script
      defer
      src="https://not-palantir.rutk.de/script.js"
      data-website-id="48e9beb7-5e01-43f6-aa21-e986b4018ef1"
      data-host-url="https://not-palantir.rutk.de"
      data-performance="true"
      data-before-send="umamiBeforeSend"
    ></script>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
